name: Generate and commit verified frontend lockfile
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lockfile-candidate.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frontend-lockfile-main
  cancel-in-progress: false
jobs:
  lockfile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Verify package manager
        run: test "$(pnpm --version)" = "10.20.0"
      - name: Generate candidate from committed manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: frontend-pnpm-lockfile-candidate
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated lockfile matches workspace manifests
        run: |
          test -s pnpm-lock.yaml
          pnpm install --lockfile-only --frozen-lockfile
          git diff --exit-code -- package.json pnpm-workspace.yaml apps packages
      - name: Validate candidate with clean frozen installation
        run: |
          test -s pnpm-lock.yaml
          sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/lockfile.sha256"
          pnpm install --frozen-lockfile
          sha256sum --check "$RUNNER_TEMP/lockfile.sha256"
      - name: Record candidate provenance and checksum
        run: |
          echo "### Frontend lockfile candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "pnpm version: $(pnpm --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "Lockfile SHA-256: $(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit policy: push to main only after audit, tests and build pass" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Validate frontend source with candidate
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit verified lockfile to main
        # The generated file is committed only after frozen install, audit,
        # typecheck, tests and production build succeed.
        run: |
          test -s pnpm-lock.yaml
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1 &&
             git diff --quiet -- pnpm-lock.yaml; then
            echo 'Verified lockfile already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A stale candidate must never be pushed after manifests changed.
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error title=Stale lockfile candidate::main advanced during validation; rerun against the new revision.'
            exit 1
          fi
          git add -- pnpm-lock.yaml
          git commit -m 'build(front): commit validated pnpm lockfile'
          git push origin HEAD:main
      - name: Explain lockfile generation failure
        if: ${{ failure() }}
        run: |
          {
            echo '### Lockfile workflow failed'
            echo 'Review the first failing step above; no lockfile was pushed.'
            echo "Source revision: $(git rev-parse HEAD)"
            echo "Lockfile exists: $([ -s pnpm-lock.yaml ] && echo yes || echo no)"
            echo 'Working tree:'
            git status --short
          } >> "$GITHUB_STEP_SUMMARY"
