name: Frontend foundation CI
on:
  push:
  pull_request:
  # Commits made with GITHUB_TOKEN do not start push-triggered workflows.
  # Run full CI after the verified lockfile workflow has finished pushing.
  workflow_run:
    workflows: ['Generate and commit verified frontend lockfile']
    types: [completed]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: 'Full 40-character backend commit SHA for compatibility test'
        required: true
        type: string
        default: '651bed63f41fe29613ff6cde90bb6a8c15c01446'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.backend_sha || 'baseline' }}
  cancel-in-progress: true
jobs:
  web:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: services_test
          POSTGRES_USER: services
          POSTGRES_PASSWORD: services
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U services -d services_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://services:services@127.0.0.1:5432/services_test
      SERVICES_API_BASE_URL: https://localhost:8443/v1
      # Test-only HMAC key: permits negative bearer checks to reach the
      # session lookup rather than fail on missing server configuration.
      ACCOUNT_SESSION_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nurgeldiserikbay/services-back
          # CI-green backend revision, pinned for reproducible frontend API compatibility.
          # Avoid a moving main branch changing frontend CI inputs between runs.
          ref: ${{ inputs.backend_sha || '651bed63f41fe29613ff6cde90bb6a8c15c01446' }}
          path: services-back
          persist-credentials: false
      - name: Verify selected backend commit SHA
        env:
          EXPECTED_BACKEND_SHA: ${{ inputs.backend_sha || '651bed63f41fe29613ff6cde90bb6a8c15c01446' }}
        run: |
          [[ "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "Frontend SHA: $(git rev-parse HEAD)"
          echo "Backend SHA: $(git -C services-back rev-parse HEAD)"
          test "$(git -C services-back rev-parse HEAD)" = "${EXPECTED_BACKEND_SHA,,}"
          {
            echo "### Tested integration revisions"
            echo "Frontend: $(git rev-parse HEAD)"
            echo "Backend: $(git -C services-back rev-parse HEAD)"
            echo "Trigger: $GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test guest and seller concurrency boundaries before dependency installation
        run: |
          node --test apps/web/tests/guest-status-version-regression.test.mjs
          node --test apps/web/tests/seller-decision-uuid-case-regression.test.mjs
      - run: corepack enable
      - name: Verify pinned pnpm version
        run: |
          test "$(pnpm --version)" = "10.20.0"
      - name: Install frontend dependencies (frozen when committed lockfile exists)
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            pnpm install --frozen-lockfile
            git diff --exit-code -- pnpm-lock.yaml
          else
            echo '::warning title=Frontend lockfile missing::pnpm-lock.yaml is not committed; dependency resolution is not reproducible. Track in issue #65.'
            pnpm install --no-frozen-lockfile
          fi
      - name: Audit production dependencies for high-severity vulnerabilities
        run: pnpm audit --prod --audit-level high
      - name: Install and migrate backend test API
        working-directory: services-back
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          # Check the account/admin bearer contract of the exact backend revision
          # used by this frontend integration run before database setup.
          node --import tsx --test test/session-proof-canonical.test.ts test/admin-session-token.test.ts
          npm run db:validate
          npm run db:migrate
          # Exercise authorization against the same migrated database used
          # for the browser-to-API integration journey.
          node --import tsx --test test/session-proof-db.test.ts test/seller-inbox-authority-parity-db.test.ts
          npm run db:seed:geo
          npm run build
      - name: Install PostgreSQL client and verify migrated schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          test "$(psql "$DATABASE_URL" -Atc 'SELECT current_database()')" = services_test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF to_regclass('public.users') IS NULL OR
               to_regclass('public.professional_profiles') IS NULL OR
               to_regclass('public.service_offers') IS NULL OR
               to_regclass('public.service_definitions') IS NULL OR
               to_regclass('public.professions') IS NULL OR
               to_regclass('public.profession_services') IS NULL OR
               to_regclass('public.organizations') IS NULL OR
               to_regclass('public.persons') IS NULL THEN
              RAISE EXCEPTION 'Missing migrated tables required by frontend fixtures';
            END IF;
          END $verify$;
          SQL
      - name: Seed public search-to-profile fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id) VALUES ('10000000-0000-4000-8000-000000000001');
          INSERT INTO persons(id,user_id,display_name) VALUES
            ('10000000-0000-4000-8000-000000000002','10000000-0000-4000-8000-000000000001','CI Specialist');
          INSERT INTO professions(id,code,name) VALUES
            ('10000000-0000-4000-8000-000000000003','ci-stage2-profession','Stage 2 CI Profession');
          INSERT INTO service_definitions(id,code,name) VALUES
            ('10000000-0000-4000-8000-000000000004','ci-stage2-service','Stage 2 CI Service');
          INSERT INTO profession_services(profession_id,service_id) VALUES
            ('10000000-0000-4000-8000-000000000003','10000000-0000-4000-8000-000000000004');
          INSERT INTO professional_profiles(id,person_id,profession_id,slug,status,title) VALUES
            ('10000000-0000-4000-8000-000000000005','10000000-0000-4000-8000-000000000002',
             '10000000-0000-4000-8000-000000000003','ci-stage2-specialist','PUBLISHED','Stage 2 Journey Specialist');
          INSERT INTO organizations(id,owner_person_id,slug,name,status) VALUES
            ('10000000-0000-4000-8000-000000000006','10000000-0000-4000-8000-000000000002',
             'ci-stage2-company','Stage 2 Journey Company','ACTIVE');
          INSERT INTO service_offers(id,definition_id,professional_id,title,status,delivery_mode,contacts) VALUES
            ('10000000-0000-4000-8000-000000000007','10000000-0000-4000-8000-000000000004',
             '10000000-0000-4000-8000-000000000005','Stage 2 Journey Specialist Offer','PUBLISHED','online','{}'::jsonb);
          INSERT INTO service_offers(id,definition_id,organization_id,title,status,delivery_mode,contacts) VALUES
            ('10000000-0000-4000-8000-000000000008','10000000-0000-4000-8000-000000000004',
             '10000000-0000-4000-8000-000000000006','Stage 2 Journey Company Offer','PUBLISHED','online','{}'::jsonb);
          SQL
      - name: Start backend test API
        run: |
          (cd services-back && PORT=3101 npm start > "$RUNNER_TEMP/services-back.log" 2>&1 &)
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3101/v1/professions >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-back.log"
          exit 1
      - name: Verify pinned backend admin HTTP boundary stays private
        run: node apps/web/tests/admin-api-boundary.e2e.mjs
      - name: Verify guest and seller lifecycle HTTP boundaries deny anonymous calls
        run: node apps/web/tests/request-lifecycle-boundary.e2e.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Create trusted HTTPS bridge to the test API
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/api.key" \
            -out "$RUNNER_TEMP/api.crt" -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/api.crt" >> "$GITHUB_ENV"
          TLS_KEY="$RUNNER_TEMP/api.key" TLS_CERT="$RUNNER_TEMP/api.crt" \
            node --input-type=module <<'NODE' &
          import fs from 'node:fs';
          import http from 'node:http';
          import https from 'node:https';
          const server = https.createServer({
            key: fs.readFileSync(process.env.TLS_KEY),
            cert: fs.readFileSync(process.env.TLS_CERT),
          }, (request, response) => {
            const upstream = http.request({
              hostname: '127.0.0.1', port: 3101, path: request.url,
              method: request.method, headers: {...request.headers, host: '127.0.0.1:3101'},
            }, (upstreamResponse) => {
              response.writeHead(upstreamResponse.statusCode ?? 502, upstreamResponse.headers);
              upstreamResponse.pipe(response);
            });
            upstream.on('error', () => {
              response.writeHead(502);
              response.end('test API unavailable');
            });
            request.pipe(upstream);
          });
          server.listen(8443, '127.0.0.1');
          NODE
          for attempt in {1..20}; do
            if curl --connect-timeout 2 --max-time 5 --cacert "$RUNNER_TEMP/api.crt" --fail --silent https://localhost:8443/v1/professions >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start frontend production server
        run: |
          (cd apps/web && pnpm start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/services-front.log" 2>&1 &)
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/ru >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-front.log"
          exit 1
      - name: Verify live search-to-profile journey
        run: node apps/web/tests/public-profile-journey.e2e.mjs
      - name: Collect integration diagnostics on failure
        if: failure()
        run: |
          echo '=== Backend API log (last 150 lines) ==='
          if [ -f "$RUNNER_TEMP/services-back.log" ]; then
            tail -n 150 "$RUNNER_TEMP/services-back.log"
          else
            echo 'Backend log was not created'
          fi
          echo '=== Frontend server log (last 150 lines) ==='
          if [ -f "$RUNNER_TEMP/services-front.log" ]; then
            tail -n 150 "$RUNNER_TEMP/services-front.log"
          else
            echo 'Frontend log was not created'
          fi
          echo '=== PostgreSQL migration status ==='
          if [ -d services-back ]; then
            (cd services-back && npx prisma migrate status) || true
          fi
