name: Frontend foundation CI
on:
  push:
  pull_request:
  # Commits made with GITHUB_TOKEN do not start push-triggered workflows.
  # Run full CI after the verified lockfile workflow has finished pushing.
  workflow_run:
    workflows: ['Generate and commit verified frontend lockfile']
    types: [completed]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: 'Full 40-character backend commit SHA for compatibility test'
        required: true
        type: string
        default: '2e5b9020f50ec1e3f67185c1b75ba83f5fda6095'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.backend_sha || 'baseline' }}
  cancel-in-progress: true
jobs:
  web:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: services_test
          POSTGRES_USER: services
          POSTGRES_PASSWORD: services
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U services -d services_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://services:services@127.0.0.1:5432/services_test
      SERVICES_API_BASE_URL: https://localhost:8443/v1
      # Test-only HMAC key: permits negative bearer checks to reach the
      # session lookup rather than fail on missing server configuration.
      ACCOUNT_SESSION_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: nurgeldiserikbay/services-back
          # Lockfile-bearing backend revision, pinned for reproducible frontend API compatibility.
          # Full integration CI has not yet been confirmed green.
          # Avoid a moving main branch changing frontend CI inputs between runs.
          ref: ${{ inputs.backend_sha || '2e5b9020f50ec1e3f67185c1b75ba83f5fda6095' }}
          path: services-back
          persist-credentials: false
      - name: Verify selected backend commit SHA
        env:
          EXPECTED_BACKEND_SHA: ${{ inputs.backend_sha || '2e5b9020f50ec1e3f67185c1b75ba83f5fda6095' }}
        run: |
          [[ "$EXPECTED_BACKEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "Frontend SHA: $(git rev-parse HEAD)"
          echo "Backend SHA: $(git -C services-back rev-parse HEAD)"
          test "$(git -C services-back rev-parse HEAD)" = "${EXPECTED_BACKEND_SHA,,}"
          # A pinned backend SHA without a committed lockfile cannot be
          # reproduced by npm ci. Fail before any lengthy database setup.
          git -C services-back ls-files --error-unmatch package-lock.json
          {
            echo "### Tested integration revisions"
            echo "Frontend: $(git rev-parse HEAD)"
            echo "Backend: $(git -C services-back rev-parse HEAD)"
            echo "Backend lockfile SHA-256: $(sha256sum services-back/package-lock.json | cut -d' ' -f1)"
            echo "Trigger: $GITHUB_EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test guest and seller concurrency boundaries before dependency installation
        id: boundary_tests
        run: |
          node --test apps/web/tests/guest-create-backend.test.mjs
          node --test apps/web/tests/guest-status-version-regression.test.mjs
          node --test apps/web/tests/seller-decision-uuid-case-regression.test.mjs
          node --test apps/web/tests/seller-decision-contract-regression.test.mjs
          node --test apps/web/tests/seller-decision-timeout.test.mjs
      - run: corepack enable
      - name: Verify pinned pnpm version
        run: |
          test "$(pnpm --version)" = "10.20.0"
      - name: Install frontend dependencies from committed lockfile
        id: frontend_install
        run: |
          git ls-files --error-unmatch pnpm-lock.yaml
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml
      - name: Audit production dependencies for high-severity vulnerabilities
        id: dependency_audit
        run: pnpm audit --prod --audit-level high
      - name: Frontend security lint
        id: frontend_lint
        run: pnpm lint
      - name: Frontend unit tests
        id: frontend_tests
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/frontend-unit-tests.log"
      - name: Summarize failed frontend unit tests
        if: ${{ always() && steps.frontend_tests.outcome == 'failure' }}
        run: |
          log="$RUNNER_TEMP/frontend-unit-tests.log"
          if [ ! -f "$log" ]; then
            echo "::error::Frontend unit test log unavailable"
            exit 0
          fi
          {
            echo '### Failed frontend unit tests'
            echo '~~~text'
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail|cancelled|skipped|todo) ' "$log" || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^not ok [0-9]+ - ' "$log" | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done || true
      - name: Upload failed frontend unit test log
        if: ${{ always() && steps.frontend_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-failures
          path: ${{ runner.temp }}/frontend-unit-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Install and migrate backend test API
        id: backend_integration
        working-directory: services-back
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          # Check the account/admin bearer contract of the exact backend revision
          # used by this frontend integration run before database setup.
          node --import tsx --test test/session-proof-canonical.test.ts test/admin-session-token.test.ts
          npm run db:validate
          npm run db:migrate
          # Exercise authorization against the same migrated database used
          # for the browser-to-API integration journey.
          node --import tsx --test test/session-proof-db.test.ts test/seller-inbox-authority-parity-db.test.ts
          # Signed-in seller success path against live PostgreSQL, with
          # transaction rollback and random ephemeral users/requests.
          node --import tsx --test test/account-otp-seller-journey-db.test.ts
          node --import tsx --test test/account-bearer-session-http.test.ts
          npm run db:seed:geo
          npm run build
      - name: Install PostgreSQL client and verify migrated schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          test "$(psql "$DATABASE_URL" -Atc 'SELECT current_database()')" = services_test
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF to_regclass('public.users') IS NULL OR
               to_regclass('public.professional_profiles') IS NULL OR
               to_regclass('public.service_offers') IS NULL OR
               to_regclass('public.service_definitions') IS NULL OR
               to_regclass('public.professions') IS NULL OR
               to_regclass('public.profession_services') IS NULL OR
               to_regclass('public.organizations') IS NULL OR
               to_regclass('public.persons') IS NULL THEN
              RAISE EXCEPTION 'Missing migrated tables required by frontend fixtures';
            END IF;
          END $verify$;
          SQL
      - name: Seed public search-to-profile fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users(id) VALUES ('10000000-0000-4000-8000-000000000001');
          INSERT INTO persons(id,user_id,display_name) VALUES
            ('10000000-0000-4000-8000-000000000002','10000000-0000-4000-8000-000000000001','CI Specialist');
          INSERT INTO professions(id,code,name) VALUES
            ('10000000-0000-4000-8000-000000000003','ci-stage2-profession','Stage 2 CI Profession');
          INSERT INTO service_definitions(id,code,name) VALUES
            ('10000000-0000-4000-8000-000000000004','ci-stage2-service','Stage 2 CI Service');
          INSERT INTO profession_services(profession_id,service_id) VALUES
            ('10000000-0000-4000-8000-000000000003','10000000-0000-4000-8000-000000000004');
          INSERT INTO professional_profiles(id,person_id,profession_id,slug,status,title) VALUES
            ('10000000-0000-4000-8000-000000000005','10000000-0000-4000-8000-000000000002',
             '10000000-0000-4000-8000-000000000003','ci-stage2-specialist','PUBLISHED','Stage 2 Journey Specialist');
          INSERT INTO organizations(id,owner_person_id,slug,name,status) VALUES
            ('10000000-0000-4000-8000-000000000006','10000000-0000-4000-8000-000000000002',
             'ci-stage2-company','Stage 2 Journey Company','ACTIVE');
          INSERT INTO service_offers(id,definition_id,professional_id,title,status,delivery_mode,contacts) VALUES
            ('10000000-0000-4000-8000-000000000007','10000000-0000-4000-8000-000000000004',
             '10000000-0000-4000-8000-000000000005','Stage 2 Journey Specialist Offer','PUBLISHED','online','{}'::jsonb);
          INSERT INTO service_offers(id,definition_id,organization_id,title,status,delivery_mode,contacts) VALUES
            ('10000000-0000-4000-8000-000000000008','10000000-0000-4000-8000-000000000004',
             '10000000-0000-4000-8000-000000000006','Stage 2 Journey Company Offer','PUBLISHED','online','{}'::jsonb);
          SQL
      - name: Start backend test API
        run: |
          umask 077
          openssl rand -base64 32 > "$RUNNER_TEMP/services-guest-capability-hmac-key"
          openssl rand -base64 32 > "$RUNNER_TEMP/services-guest-contact-encryption-key"
          (cd services-back && PORT=3101 \
            SERVICES_ENABLE_GUEST_STATUS_HTTP=enabled \
            SERVICES_ENABLE_GUEST_CREATE_HTTP=enabled \
            SERVICES_ENABLE_REGISTERED_REQUEST_CREATE_HTTP=enabled \
            SERVICES_ENABLE_PROFILE_PUBLISH=enabled \
            GUEST_CONTACT_ENCRYPTION_KEY="$(cat "$RUNNER_TEMP/services-guest-contact-encryption-key")" \
            GUEST_REQUEST_HMAC_KEY="$(cat "$RUNNER_TEMP/services-guest-capability-hmac-key")" \
            npm start > "$RUNNER_TEMP/services-back.log" 2>&1 &)
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3101/v1/professions >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-back.log"
          exit 1
      - name: Verify pinned backend admin HTTP boundary stays private
        id: admin_http_boundary
        run: node apps/web/tests/admin-api-boundary.e2e.mjs
      - name: Verify guest and seller lifecycle HTTP boundaries deny anonymous calls
        id: lifecycle_http_boundary
        run: node apps/web/tests/request-lifecycle-boundary.e2e.mjs
      - name: Frontend typecheck
        id: frontend_typecheck
        run: pnpm typecheck
      - name: Frontend production build
        id: frontend_build
        run: pnpm build
      - name: Create trusted HTTPS bridge to the test API
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/api.key" \
            -out "$RUNNER_TEMP/api.crt" -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/api.crt" >> "$GITHUB_ENV"
          TLS_KEY="$RUNNER_TEMP/api.key" TLS_CERT="$RUNNER_TEMP/api.crt" \
            node --input-type=module <<'NODE' &
          import fs from 'node:fs';
          import http from 'node:http';
          import https from 'node:https';
          const server = https.createServer({
            key: fs.readFileSync(process.env.TLS_KEY),
            cert: fs.readFileSync(process.env.TLS_CERT),
          }, (request, response) => {
            const upstream = http.request({
              hostname: '127.0.0.1', port: 3101, path: request.url,
              method: request.method, headers: {...request.headers, host: '127.0.0.1:3101'},
              timeout: 10000,
            }, (upstreamResponse) => {
              response.writeHead(upstreamResponse.statusCode ?? 502, upstreamResponse.headers);
              upstreamResponse.pipe(response);
            });
            upstream.on('timeout', () => upstream.destroy(new Error('test API timeout')));
            upstream.on('error', () => {
              // An upstream can fail after response headers were forwarded.
              // Never write a second header block or crash the CI bridge.
              if (response.headersSent) {
                response.destroy();
              } else {
                response.writeHead(502);
                response.end('test API unavailable');
              }
            });
            request.pipe(upstream);
          });
          server.listen(8443, '127.0.0.1');
          NODE
          for attempt in {1..20}; do
            if curl --connect-timeout 2 --max-time 5 --cacert "$RUNNER_TEMP/api.crt" --fail --silent https://localhost:8443/v1/professions >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start frontend production server
        run: |
          (cd apps/web && pnpm start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/services-front.log" 2>&1 &)
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/ru >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-front.log"
          exit 1
      - name: Verify live production Next.js response security headers
        id: live_security_headers
        run: node apps/web/tests/live-response-security-headers.e2e.mjs
      # Error recovery must be verified against a real Next.js response, not
      # source regex or mocked backend fetch. Keep this instance isolated from
      # the healthy API and the feature-enabled private BFF.
      - name: Start isolated search-upstream-failure production frontend
        run: |
          (
            cd apps/web
            SERVICES_API_BASE_URL=https://127.0.0.1:8444/v1 \
            pnpm start --hostname 127.0.0.1 --port 3002 > "$RUNNER_TEMP/services-search-failure.log" 2>&1 &
          )
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3002/ru >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-search-failure.log"
          exit 1
      - name: Verify search failure exposes localized retry on real HTTP
        id: search_failure_e2e
        run: node apps/web/tests/public-search-retry-failure.e2e.mjs
      - name: Start isolated feature-enabled private BFF without real login
        run: |
          umask 077
          openssl rand -base64 32 > "$RUNNER_TEMP/services-private-bff-account-key"
          openssl rand -base64 32 > "$RUNNER_TEMP/services-private-bff-account-otp-preauth-key"
          openssl rand -base64 32 > "$RUNNER_TEMP/services-private-bff-guest-key"
          (
            cd apps/web
            SERVICES_WEB_ENABLE_GUEST_STATUS_HTTP=enabled \
            SERVICES_WEB_ENABLE_GUEST_CREATE_HTTP=enabled \
            SERVICES_WEB_ENABLE_GUEST_OTP_START_HTTP=enabled \
            SERVICES_WEB_ENABLE_GUEST_OTP_BFF=enabled \
            SERVICES_WEB_ENABLE_SELLER_BFF=enabled \
            SERVICES_WEB_ENABLE_SELLER_WORKSPACE=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_SESSION_BFF=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_LOGIN_BFF=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_OTP_BOOTSTRAP=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_HOME=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_DEVICES_PAGE=enabled \
            SERVICES_WEB_ENABLE_CUSTOMER_REQUESTS=enabled \
            SERVICES_WEB_ENABLE_CUSTOMER_COMPLETION=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_SCHEDULE=enabled \
            SERVICES_WEB_ENABLE_CUSTOMER_REQUEST_CREATE=enabled \
            SERVICES_WEB_ENABLE_ACCOUNT_NOTIFICATIONS=enabled \
            SERVICES_WEB_ENABLE_PROFESSIONAL_PROFILES=enabled \
            SERVICES_WEB_ENABLE_PROFESSIONAL_PROFILE_CREATION=enabled \
            SERVICES_WEB_ENABLE_PROFESSIONAL_PROFILE_EDITING=enabled \
            SERVICES_WEB_ENABLE_PROFESSIONAL_PROFILE_PREVIEW=enabled \
            SERVICES_WEB_ENABLE_PROFESSIONAL_PROFILE_PUBLICATION=enabled \
            SERVICES_WEB_GUEST_SESSION_KEY="$(cat "$RUNNER_TEMP/services-private-bff-guest-key")" \
            SERVICES_WEB_ACCOUNT_SESSION_KEY="$(cat "$RUNNER_TEMP/services-private-bff-account-key")" \
            SERVICES_WEB_ACCOUNT_OTP_PREAUTH_KEY="$(cat "$RUNNER_TEMP/services-private-bff-account-otp-preauth-key")" \
            SERVICES_WEB_ORIGIN=https://services.example.test \
            pnpm start --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/services-private-bff.log" 2>&1 &
          )
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3001/ru >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-private-bff.log"
          exit 1
      - name: Verify private workspace denial and no-store over live HTTP
        id: private_workspace_http_e2e
        run: node apps/web/tests/live-private-workspace-response.e2e.mjs
      - name: Verify guest OTP bootstrap CSRF and unavailable-provider isolation
        id: otp_bootstrap_e2e
        run: node apps/web/tests/private-bff-otp-bootstrap.e2e.mjs
      - name: Verify enabled private BFF still rejects missing and forged sessions
        id: enabled_private_denial_e2e
        run: node apps/web/tests/private-bff-enabled-denial.e2e.mjs
      - name: Verify isolated account OTP bootstrap stays CSRF-bound and verify disabled
        id: account_otp_bootstrap_e2e
        run: node apps/web/tests/account-otp-bootstrap-live-http.e2e.mjs
      - name: Start isolated schedule browser ingress
        run: |
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/services-schedule-ingress.log" 2>&1 &
          import http from 'node:http';
          const server=http.createServer((req,res)=>{
            const headers={...req.headers,host:'127.0.0.1:3001'};
            // Translate only the native same-origin browser POST from the
            // isolated loopback listener to the configured CI public origin.
            if(req.method==='POST' &&
               (/^\/api\/account\/requests\/[0-9a-f-]+\/schedule-proposals(?:\/[0-9a-f-]+\/(?:confirm|decline))?$/.test(req.url) ||
                /^\/api\/seller\/requests\/[0-9a-f-]+\/(?:accept|decline)$/.test(req.url)) &&
               headers.origin==='http://127.0.0.1:3011' &&
               headers['sec-fetch-site']==='same-origin'){
              headers.origin='https://services.example.test';
            }
            const upstream=http.request({hostname:'127.0.0.1',port:3001,path:req.url,method:req.method,headers,timeout:10000},reply=>{
              res.writeHead(reply.statusCode,reply.headers);reply.pipe(res);
            });
            upstream.on('timeout',()=>upstream.destroy());
            upstream.on('error',()=>{if(!res.headersSent)res.writeHead(502);res.end();});
            req.pipe(upstream);
          });
          server.listen(3011,'127.0.0.1');
          NODE
          for attempt in {1..20}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3011/ru >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify signed web session reaches backend and revocation invalidates access
        id: signed_seller_session_e2e
        run: node apps/web/tests/private-bff-signed-session.e2e.mjs
      - name: Verify owner profile create edit approve publish and public search in real stack
        id: professional_lifecycle_e2e
        run: node apps/web/tests/private-bff-professional-publish-search.e2e.mjs
      - name: Verify registered customer create via real BFF, backend and PostgreSQL inventory
        id: registered_customer_create_e2e
        run: node apps/web/tests/private-bff-registered-create-journey.e2e.mjs
      - name: Verify live customer inventory to confirmed completion via latest backend
        id: customer_completion_e2e
        run: node apps/web/tests/private-bff-customer-completion.e2e.mjs
      - name: Verify live guest status scoped proof and foreign-request rejection
        id: guest_status_proof_e2e
        run: node apps/web/tests/private-bff-guest-status.e2e.mjs
      - name: Verify verified-test guest creation returns scoped status cookie
        id: guest_create_status_e2e
        run: node apps/web/tests/private-bff-guest-create-journey.e2e.mjs
      - name: Start isolated CI-only backend with captured completion OTP delivery
        run: |
          umask 077
          openssl rand -base64 32 > "$RUNNER_TEMP/services-guest-network-attestation-key"
          cp apps/web/tests/fixtures/guest-completion-ci-server.mjs services-back/test/guest-completion-ci-server.mjs
          (
            cd services-back
            SERVICES_TEST_OTP_DELIVERY=fixture \
            SERVICES_ENABLE_GUEST_OTP_HTTP=enabled \
            SERVICES_ENABLE_GUEST_CREATE_HTTP=enabled \
            SERVICES_ENABLE_GUEST_STATUS_HTTP=enabled \
            SERVICES_GUEST_COMPLETION_CODE_FILE="$RUNNER_TEMP/services-guest-completion-otp.json" \
            SERVICES_ENABLE_GUEST_COMPLETION_HTTP=enabled \
            SERVICES_ENABLE_GUEST_SCHEDULE_HTTP=enabled \
            GUEST_CONTACT_ENCRYPTION_KEY="$(cat "$RUNNER_TEMP/services-guest-contact-encryption-key")" \
            GUEST_REQUEST_HMAC_KEY="$(cat "$RUNNER_TEMP/services-guest-capability-hmac-key")" \
            GUEST_NETWORK_ATTESTATION_KEY="$(cat "$RUNNER_TEMP/services-guest-network-attestation-key")" \
            node test/guest-completion-ci-server.mjs \
              > "$RUNNER_TEMP/services-completion-ci-back.log" 2>&1 &
          )
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent \
              http://127.0.0.1:3103/v1/professions >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-completion-ci-back.log"
          exit 1
      - name: Start isolated HTTPS completion backend bridge
        run: |
          GUEST_NETWORK_ATTESTATION_KEY_FILE="$RUNNER_TEMP/services-guest-network-attestation-key" \
          TLS_KEY="$RUNNER_TEMP/api.key" TLS_CERT="$RUNNER_TEMP/api.crt" \
            node --input-type=module <<'NODE' &
          import fs from 'node:fs';
          import http from 'node:http';
          import https from 'node:https';
          import {createHmac,randomBytes} from 'node:crypto';
          const networkKey=Buffer.from(fs.readFileSync(process.env.GUEST_NETWORK_ATTESTATION_KEY_FILE,'utf8').trim(),'base64');
          if(networkKey.length!==32||process.env.CI!=='true')throw Error('invalid isolated CI signer');
          const networkDigest=randomBytes(32).toString('hex');
          const server=https.createServer({
            key:fs.readFileSync(process.env.TLS_KEY),
            cert:fs.readFileSync(process.env.TLS_CERT),
          },(request,response)=>{
            const headers={...request.headers,host:'127.0.0.1:3103'};
            // Only this isolated backend bridge signs initial OTP requests.
            if(request.method==='POST'&&request.url==='/v1/guest-requests/challenges'){
              delete headers['x-services-network-proof'];
              const timestamp=String(Date.now());
              const signature=createHmac('sha256',networkKey).update('services-otp-network:v1\n'+networkDigest+'\n'+timestamp).digest('hex');
              headers['x-services-network-proof']='v1.'+networkDigest+'.'+timestamp+'.'+signature;
            }
            const upstream=http.request({
              hostname:'127.0.0.1',port:3103,path:request.url,
              method:request.method,
              headers,
              timeout:10000,
            },upstreamResponse=>{
              response.writeHead(upstreamResponse.statusCode??502,upstreamResponse.headers);
              upstreamResponse.pipe(response);
            });
            upstream.on('timeout',()=>upstream.destroy(new Error('test API timeout')));
            upstream.on('error',()=>{
              if(response.headersSent)response.destroy();
              else{response.writeHead(502);response.end('CI backend unavailable');}
            });
            request.pipe(upstream);
          });
          server.listen(8445,'127.0.0.1');
          NODE
          for attempt in {1..20}; do
            if curl --connect-timeout 2 --max-time 5 --cacert "$RUNNER_TEMP/api.crt" \
              --fail --silent https://localhost:8445/v1/professions >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start isolated feature-enabled guest completion Next.js BFF
        run: |
          (
            cd apps/web
            SERVICES_API_BASE_URL=https://localhost:8445/v1 \
            SERVICES_WEB_ENABLE_GUEST_COMPLETION_BFF=enabled \
            SERVICES_WEB_ENABLE_GUEST_SCHEDULE_BFF=enabled \
            SERVICES_WEB_ENABLE_GUEST_SCHEDULE_UI=enabled \
            SERVICES_WEB_ENABLE_GUEST_STATUS_HTTP=enabled \
            SERVICES_WEB_ENABLE_GUEST_WIZARD=enabled \
            SERVICES_WEB_ENABLE_GUEST_OTP_START_HTTP=enabled \
            SERVICES_WEB_ENABLE_GUEST_OTP_VERIFY_HTTP=enabled \
            SERVICES_WEB_ENABLE_GUEST_OTP_BFF=enabled \
            SERVICES_WEB_ENABLE_GUEST_CREATE_HTTP=enabled \
            SERVICES_WEB_GUEST_SESSION_KEY="$(cat "$RUNNER_TEMP/services-private-bff-guest-key")" \
            GUEST_NETWORK_ATTESTATION_KEY="$(cat "$RUNNER_TEMP/services-guest-network-attestation-key")" \
            SERVICES_WEB_ORIGIN=https://services.example.test \
            pnpm start --hostname 127.0.0.1 --port 3003 \
              > "$RUNNER_TEMP/services-completion-ci-front.log" 2>&1 &
          )
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent \
              http://127.0.0.1:3003/ru >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/services-completion-ci-front.log"
          exit 1
      - name: Start isolated guest schedule browser ingress
        run: |
          GUEST_NETWORK_ATTESTATION_KEY_FILE="$RUNNER_TEMP/services-guest-network-attestation-key" \
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/services-guest-schedule-ingress.log" 2>&1 &
          import http from 'node:http';
          import fs from 'node:fs';
          import {createHmac,randomBytes} from 'node:crypto';
          const networkKey=Buffer.from(fs.readFileSync(process.env.GUEST_NETWORK_ATTESTATION_KEY_FILE,'utf8').trim(),'base64');
          if(process.env.CI!=='true'||networkKey.length!==32)throw Error('invalid CI browser signer');
          const networkDigest=randomBytes(32).toString('hex');
          const server=http.createServer((req,res)=>{
            const headers={...req.headers,host:'127.0.0.1:3003'};
            // CI-only origin translation, limited to same-origin guest schedule mutations.
            if(req.method==='POST' &&
               (/^\/api\/guest-requests(?:\/challenges\/(?:start|verify))?$/.test(req.url) ||
               /^\/api\/guest-requests\/[0-9a-f-]+\/(?:schedule-access\/challenges(?:\/[0-9a-f-]+\/verify)?|schedule-proposals(?:\/active|\/[0-9a-f-]+\/(?:confirm|decline))?)$/.test(req.url)) &&
               headers.origin==='http://127.0.0.1:3013' &&
               headers['sec-fetch-site']==='same-origin'){
              headers.origin='https://services.example.test';
              // Sign only exact schedule issuance; never trust a browser-supplied proof.
              if(/^\/api\/guest-requests\/[0-9a-f-]+\/schedule-access\/challenges$/.test(req.url)){
                delete headers['x-services-network-proof'];
                const ts=String(Date.now());
                const signature=createHmac('sha256',networkKey).update('services-otp-network:v1\n'+networkDigest+'\n'+ts).digest('hex');
                headers['x-services-network-proof']='v1.'+networkDigest+'.'+ts+'.'+signature;
              }
            }
            const upstream=http.request({hostname:'127.0.0.1',port:3003,path:req.url,method:req.method,headers,timeout:10000},reply=>{
              res.writeHead(reply.statusCode,reply.headers);reply.pipe(res);
            });
            upstream.on('timeout',()=>upstream.destroy());
            upstream.on('error',()=>{if(!res.headersSent)res.writeHead(502);res.end();});
            req.pipe(upstream);
          });
          server.listen(3013,'127.0.0.1');
          NODE
          for attempt in {1..20}; do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3013/ru >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify live guest create, seller accept, OTP reverify, one-use completion and refreshed status in PostgreSQL
        id: guest_seller_lifecycle_e2e
        run: node apps/web/tests/private-bff-guest-seller-full-journey.e2e.mjs
      - name: Diagnose isolated guest completion OTP dispatch failure without secrets
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/services-completion-ci-back.log"; then
            grep -E 'CI_GUEST_COMPLETION_DISPATCH_ERROR|CI_GUEST_SCHEDULE_ERROR' "$RUNNER_TEMP/services-completion-ci-back.log" || true
          fi
      - name: Verify private frontend BFF routes remain default-off over live HTTP
        id: private_bff_e2e
        run: node apps/web/tests/private-bff-default-off.e2e.mjs
      - name: Verify production service worker never intercepts private routes
        id: worker_isolation_e2e
        run: node apps/web/tests/live-pwa-worker-isolation.e2e.mjs
      - name: Verify mobile keyboard and landmarks in headless Chrome
        id: chrome_mobile_e2e
        run: |
          command -v google-chrome
          node apps/web/tests/live-chrome-accessibility.e2e.mjs
      - name: Capture mobile Chrome lab web-vitals baseline
        id: chrome_perf_baseline
        run: |
          command -v google-chrome
          node apps/web/tests/live-chrome-web-vitals.e2e.mjs
      - name: Upload Chrome lab performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-chrome-lab-performance
          path: artifacts/performance-baseline.json
          if-no-files-found: warn
          retention-days: 14
      - name: Capture localized Lighthouse mobile audits
        id: lighthouse_mobile
        run: |
          command -v google-chrome
          mkdir -p artifacts
          # Pin Lighthouse to a previously published stable version; 13.6.0's npm
          # dependency resolution failed with @sentry/server-utils@11.14.0 (ETARGET).
          # No production dependency
          # or pnpm-lockfile changes for this CI-only instrument.
          for locale in kk ru; do
            succeeded=0
            for attempt in 1 2 3; do
              rm -f "artifacts/lighthouse-$locale-mobile.json"
              # Chrome may occasionally fail to start its navigation trace.
              # Retry ONLY NO_NAVSTART: never hide app/audit failures.
              if npx --yes lighthouse@13.5.0 "http://127.0.0.1:3000/$locale" \
                --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
                --form-factor=mobile \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="artifacts/lighthouse-$locale-mobile.json" \
                --quiet > "$RUNNER_TEMP/lighthouse-$locale.log" 2>&1; then
                succeeded=1
                break
              fi
              cat "$RUNNER_TEMP/lighthouse-$locale.log"
              if ! grep -q 'NO_NAVSTART' "$RUNNER_TEMP/lighthouse-$locale.log" || [ "$attempt" = 3 ]; then
                echo "::error::Lighthouse $locale audit failed (not a recoverable navigation trace)"
                exit 1
              fi
              echo "::warning::Lighthouse $locale transient NO_NAVSTART; retry $attempt of 3"
              sleep 3
            done
            test "$succeeded" = 1
            test -s "artifacts/lighthouse-$locale-mobile.json"
          done
          node apps/web/tests/validate-lighthouse-reports.e2e.mjs
      - name: Upload localized Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lighthouse-mobile-audits
          path: |
            artifacts/lighthouse-kk-mobile.json
            artifacts/lighthouse-ru-mobile.json
            artifacts/lighthouse-mobile-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify real Chrome PWA worker offline and private cache isolation
        id: chrome_offline_e2e
        run: |
          command -v google-chrome
          node apps/web/tests/live-chrome-sw-offline.e2e.mjs
      - name: Verify live search-to-profile journey
        id: live_e2e
        run: node apps/web/tests/public-profile-journey.e2e.mjs
      - name: Summarize integration gate results
        if: always()
        env:
          BOUNDARY_TESTS: ${{ steps.boundary_tests.outcome }}
          ADMIN_HTTP_BOUNDARY: ${{ steps.admin_http_boundary.outcome }}
          LIFECYCLE_HTTP_BOUNDARY: ${{ steps.lifecycle_http_boundary.outcome }}
          FRONTEND_INSTALL: ${{ steps.frontend_install.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
          BACKEND_INTEGRATION: ${{ steps.backend_integration.outcome }}
          FRONTEND_TYPECHECK: ${{ steps.frontend_typecheck.outcome }}
          FRONTEND_LINT: ${{ steps.frontend_lint.outcome }}
          FRONTEND_TESTS: ${{ steps.frontend_tests.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          OTP_BOOTSTRAP_E2E: ${{ steps.otp_bootstrap_e2e.outcome }}
          ENABLED_PRIVATE_DENIAL_E2E: ${{ steps.enabled_private_denial_e2e.outcome }}
          SIGNED_SELLER_SESSION_E2E: ${{ steps.signed_seller_session_e2e.outcome }}
          PROFESSIONAL_LIFECYCLE_E2E: ${{ steps.professional_lifecycle_e2e.outcome }}
          REGISTERED_CREATE_E2E: ${{ steps.registered_customer_create_e2e.outcome }}
          GUEST_STATUS_PROOF_E2E: ${{ steps.guest_status_proof_e2e.outcome }}
          GUEST_CREATE_STATUS_E2E: ${{ steps.guest_create_status_e2e.outcome }}
          PRIVATE_BFF_E2E: ${{ steps.private_bff_e2e.outcome }}
          WORKER_ISOLATION_E2E: ${{ steps.worker_isolation_e2e.outcome }}
          CHROME_MOBILE_E2E: ${{ steps.chrome_mobile_e2e.outcome }}
          CHROME_OFFLINE_E2E: ${{ steps.chrome_offline_e2e.outcome }}
          CHROME_PERF_BASELINE: ${{ steps.chrome_perf_baseline.outcome }}
          LIVE_SECURITY_HEADERS: ${{ steps.live_security_headers.outcome }}
          PRIVATE_WORKSPACE_HTTP: ${{ steps.private_workspace_http_e2e.outcome }}
          LIGHTHOUSE_MOBILE: ${{ steps.lighthouse_mobile.outcome }}
          LIVE_E2E: ${{ steps.live_e2e.outcome }}
          SEARCH_FAILURE_E2E: ${{ steps.search_failure_e2e.outcome }}
        run: |
          {
            echo '### Integration gate outcomes'
            echo '| Gate | Outcome |'
            echo '| --- | --- |'
            echo "| Guest and seller boundary regression tests | $BOUNDARY_TESTS |"
            echo "| Admin HTTP authentication boundary | $ADMIN_HTTP_BOUNDARY |"
            echo "| Guest and seller lifecycle HTTP boundary | $LIFECYCLE_HTTP_BOUNDARY |"
            echo "| Frontend lockfile install | $FRONTEND_INSTALL |"
            echo "| Dependency security audit | $DEPENDENCY_AUDIT |"
            echo "| Backend migration and integration | $BACKEND_INTEGRATION |"
            echo "| Frontend security lint | $FRONTEND_LINT |"
            echo "| Frontend TypeScript | $FRONTEND_TYPECHECK |"
            echo "| Frontend unit tests | $FRONTEND_TESTS |"
            echo "| Frontend production build | $FRONTEND_BUILD |"
            echo "| Localized search retry with isolated upstream outage | $SEARCH_FAILURE_E2E |"
            echo "| OTP CSRF bootstrap and unavailable-provider isolation | $OTP_BOOTSTRAP_E2E |"
            echo "| Enabled private BFF unauthorized proof rejection | $ENABLED_PRIVATE_DENIAL_E2E |"
            echo "| Signed seller web session and backend revocation | $SIGNED_SELLER_SESSION_E2E |"
            echo "| Moderated owner profile create/edit/publish to public search | $PROFESSIONAL_LIFECYCLE_E2E |"
            echo "| Registered customer create to own inventory real PostgreSQL | $REGISTERED_CREATE_E2E |"
            echo "| Guest status scoped proof and expiry HTTP E2E | $GUEST_STATUS_PROOF_E2E |"
            echo "| Verified guest create to status-cookie HTTP E2E | $GUEST_CREATE_STATUS_E2E |"
            echo "| Private frontend BFF live HTTP E2E | $PRIVATE_BFF_E2E |"
            echo "| Served worker isolation E2E | $WORKER_ISOLATION_E2E |"
            echo "| Chrome mobile and keyboard smoke | $CHROME_MOBILE_E2E |"
            echo "| Chrome mobile unthrottled lab Web Vitals baseline (not release SLO) | $CHROME_PERF_BASELINE |"
            echo "| Live Next.js response security headers (loopback, not staging TLS) | $LIVE_SECURITY_HEADERS |"
            echo "| Private workspace live HTTP denial and cache isolation | $PRIVATE_WORKSPACE_HTTP |"
            echo "| Lighthouse mobile lab audits (not field SLO) | $LIGHTHOUSE_MOBILE |"
            echo "| Chrome service worker offline E2E | $CHROME_OFFLINE_E2E |"
            echo "| Live search-to-profile E2E | $LIVE_E2E |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect integration diagnostics on failure
        if: failure()
        run: |
          echo '=== Backend API log (last 150 lines) ==='
          if [ -f "$RUNNER_TEMP/services-back.log" ]; then
            tail -n 150 "$RUNNER_TEMP/services-back.log"
          else
            echo 'Backend log was not created'
          fi
          echo '=== Frontend server log (last 150 lines) ==='
          if [ -f "$RUNNER_TEMP/services-front.log" ]; then
            tail -n 150 "$RUNNER_TEMP/services-front.log"
          else
            echo 'Frontend log was not created'
          fi
          echo '=== PostgreSQL migration status ==='
          if [ -d services-back ]; then
            (cd services-back && npx prisma migrate status) || true
          fi
